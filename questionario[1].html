<!DOCTYPE html><html><head><meta charset='utf-8'><title>Revelando o Templo</title><link rel='stylesheet' href='style.css'></head><body class='questionario'><div class='card'><h1>Revelando o Templo</h1><p class='sub'>Cada escolha aproxima-nos mais do Senhor.</p><h2 id='p'></h2><button id='sim'>Sim</button><button id='nao'>Ainda estou trabalhando nisso</button></div><script type='module'>import {db,doc,updateDoc,increment} from './firebase.js';const qs=['Tenho uma foto do templo em casa ou no celular.','Penso frequentemente em fazer convênios no templo.','Já participei de batismos vicários.','Tenho uma meta relacionada ao templo.','Costumo orar para me preparar espiritualmente.','Sei explicar por que os templos são importantes.','Tenho interesse em história da família.','Leio ou ouço ensinamentos sobre o templo.','Sinto desejo de frequentar o templo.','Procuro viver dignamente para entrar no templo.'];let i=0;const p=document.getElementById('p');p.textContent=qs[0];async function r(sim){let obj={respostas:increment(1)};if(sim){obj.pontos=increment(1);obj.quadradosRevelados=increment(1)}await updateDoc(doc(db,'atividade','progresso'),obj);i++;if(i<qs.length){p.textContent=qs[i]}else{document.body.innerHTML='<div class=card><h1>Obrigado!</h1><p>Sua participação ajudou a revelar o templo.</p></div>'}};sim.onclick=()=>r(true);nao.onclick=()=>r(false);</script></body></html>
